name: Password reset checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/ForgotPasswordPage.tsx"
      - "src/pages/ForgotPasswordPage.test.tsx"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - ".github/workflows/password-reset-check.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  password-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test -- --reporter=verbose
      - name: Build production bundle
        run: npm run build
