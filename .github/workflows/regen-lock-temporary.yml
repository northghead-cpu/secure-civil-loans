name: Temporary lockfile regeneration for security remediation
on:
  push:
    branches: [security/riverbanc-access-hardening-20261010]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Resolve and refresh lockfile
        run: bun install
      - name: Emit refreshed lockfile for commit
        run: |
          echo LOCKFILE_BASE64_BEGIN
          base64 -w0 bun.lock
          echo
          echo LOCKFILE_BASE64_END
