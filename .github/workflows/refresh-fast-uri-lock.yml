name: Refresh fast-uri lockfile

on:
  push:
    branches: [systems-health-95pct]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor == 'northghead-cpu' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Refresh lockfile only when fast-uri is pinned to the patched release
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.overrides?.['fast-uri']!=='3.1.7') process.exit(0)"
          bun install --lockfile-only
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'fix(deps): refresh bun lockfile for fast-uri 3.1.7'
          git push
