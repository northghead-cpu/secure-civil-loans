name: Handshake Integration Checks

on:
  push:
    branches:
      - feat/handshake-api-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm test -- --reporter=dot

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check sender and shared CORS helper
        run: deno check supabase/functions/send-handshake-referral/index.ts