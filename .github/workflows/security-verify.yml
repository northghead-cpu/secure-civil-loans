name: Security verification (temporary)

on:
  push:
    branches:
      - fix/aikido-security-sast-85872894-tfut

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun run vitest run
      - name: Production dependency audit
        run: bun audit --prod --audit-level=high
      - name: Secret scan
        run: |
          set -e
          patterns='SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*[A-Za-z0-9._-]{20,}|BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|sk_test_[0-9A-Za-z]{16,}'
          if grep -R -nE "$patterns" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude='*.lock' --exclude='bun.lock' --exclude='bun.lockb' \
              --exclude-dir=.github .; then
            exit 1
          fi
