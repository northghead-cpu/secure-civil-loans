name: Security verification (temporary)

on:
  push:
    branches:
      - fix/aikido-security-sast-85872894-tfut

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun run vitest run
      - name: Production dependency audit
        run: bun audit --prod --audit-level=high --ignore GHSA-qwww-vcr4-c8h2
