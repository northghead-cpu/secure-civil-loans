name: Temporary lint fix

on:
  push:
    branches: [systems-health-95pct]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Normalize lint-reported regex escapes
        run: |
          sed -i '84s#\\/#/#g;85s#\\/#/#g' src/services/ocrService.ts
          sed -i 's#\\/\-#/-#g; s#\\/#/#g; s#\\\. #. #g' src/services/fraudDetectionService.ts
          sed -i 's#\\/#/#g' supabase/functions/crb-proxy/index.ts
      - run: bun run lint
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/ocrService.ts src/services/fraudDetectionService.ts supabase/functions/crb-proxy/index.ts
          git diff --cached --quiet || git commit -m "fix: normalize lint-blocking regex literals"
          git push
