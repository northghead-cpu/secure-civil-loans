name: Temporary lint fix

on:
  push:
    branches: [systems-health-95pct]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Normalize only the lint-reported regex literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "src/services/fraudDetectionService.ts": {
                  r"/[^\w\s\/\-\.]/g": r"/[^\w\s/.-]/g",
                  r"/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/": r"/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/",
                  r"/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/": r"/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/",
              },
              "src/services/ocrService.ts": {
                  r"[\/\-]": r"[/-]",
              },
              "supabase/functions/crb-proxy/index.ts": {
                  r"^[0-9\/\s-]+$": r"^[0-9/\s-]+$",
              },
          }
          for name, mapping in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - run: bun run lint
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/fraudDetectionService.ts src/services/ocrService.ts supabase/functions/crb-proxy/index.ts
          git diff --cached --quiet || git commit -m "fix: normalize regex literals for lint correctness"
          git push
