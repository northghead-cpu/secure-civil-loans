name: Temporary lint fix

on:
  push:
    branches: [systems-health-95pct]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Normalize only the lint-reported regex literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/services/ocrService.ts")
          text = path.read_text()
          text = text.replace(r"[\/-]", r"[/-]")
          path.write_text(text)
          PY
      - run: bun run lint
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/ocrService.ts
          git diff --cached --quiet || git commit -m "fix: normalize OCR date regex literals"
          git push
