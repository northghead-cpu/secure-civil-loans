name: Temporary Bun lockfile repair
on:
  push:
    branches: [security/riverbanc-access-hardening-20261010]
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/riverbanc-access-hardening-20261010
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Refresh lockfile and commit only the lockfile
        run: |
          bun install
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh Bun lockfile for reproducible CI"
            git push origin HEAD:security/riverbanc-access-hardening-20261010
          else
            echo "Bun lockfile is already current."
          fi
