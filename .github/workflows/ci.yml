name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run vitest run

  audit:
    # Supply-chain gate: fail the build on any high/critical advisory in
    # runtime dependencies. Dev-only vulns are reported but don't block.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high
      - name: Audit dev dependencies (non-blocking)
        continue-on-error: true
        run: bun audit --audit-level=high

  secret-scan:
    # Cheap regex sweep for accidental key commits. Blocks obvious leaks
    # without needing a paid scanner. Whitelist-safe: publishable/anon
    # Supabase keys live in .env and are OK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for service-role keys and private material
        run: |
          set -e
          # Match key-like material, not the plain word "service_role"
          # (which legitimately appears in GRANT statements in migrations).
          patterns='SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*[A-Za-z0-9._-]{20,}|"service_role"\s*:\s*"[A-Za-z0-9._-]{20,}"|BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|sk_test_[0-9A-Za-z]{16,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          if grep -R -nE "$patterns" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude='*.lock' --exclude='bun.lock' --exclude='bun.lockb' \
              --exclude-dir=.github \
              .; then
            echo "::error::Potential secret detected. Rotate the key and remove it from the repo."
            exit 1
          fi

