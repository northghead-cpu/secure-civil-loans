name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pin third-party workflow code to immutable commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Migration filename and recorded-ledger regressions
        run: node --test scripts/migration-history.test.mjs
      - run: bun run vitest run
      - name: Isolated PostgreSQL workflow regression tests
        run: bun run test:db-ui
      - name: Marketplace private storage authorization regressions
        run: bun run test:storage-security
      - name: Marketplace KYC export authorization and archive regressions
        run: |
          node scripts/test-handshake-status.mjs
          bun run vitest run --config vitest.status.config.ts
          node scripts/test-kyc-release-source.mjs
          node --test supabase/functions/kyc-package-export/handler.test.mjs
      - name: Synthetic encrypted backup and recovery regressions
        run: node --test ops/kyc-security/*.test.mjs
      - name: Assessment authorization and request-security regressions
        run: |
          node scripts/test-assessment-remediation.mjs
          node scripts/test-referral-security.mjs
          node scripts/test-referral-limit.mjs
      - name: Edge cache and receipt regressions
        run: |
          npm ci --prefix supabase/tests/edge --ignore-scripts --no-audit --no-fund
          node scripts/test-document-validation.mjs
          npx --yes --package=deno@2.9.6 deno test --config=supabase/tests/edge/deno.json --allow-env --no-prompt supabase/tests/edge/security.test.ts
      - name: Typecheck
        run: bun x tsc -b --noEmit
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Check privileged Edge Functions in Deno
        run: >-
          npx --yes --package=deno@2.9.6 deno check
          --config=supabase/tests/edge/deno.json
          supabase/functions/handshake-status/index.ts
          supabase/functions/process-loan/index.ts
          supabase/functions/crb-proxy/index.ts
          supabase/functions/reference-data/index.ts
          supabase/functions/sheets-export/index.ts
          supabase/functions/aikido-incident-webhook/index.ts
          supabase/functions/sentry-incident-webhook/index.ts
          supabase/functions/send-handshake-referral/index.ts
          supabase/functions/upload-kyc-document/index.ts
          supabase/functions/marketplace-storage-worker/index.ts
          supabase/functions/kyc-package-export/index.ts

  audit:
    # Fail on advisories in production and development dependencies; no exceptions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=low
      - name: Audit all dependencies
        run: bun audit --audit-level=low
      - name: Audit isolated Edge test dependencies
        run: |
          npm ci --prefix supabase/tests/edge --ignore-scripts --no-audit --no-fund
          npm audit --prefix supabase/tests/edge --audit-level=low
      - name: Audit isolated storage backup dependencies
        run: |
          npm ci --prefix ops/kyc-security --ignore-scripts --no-audit --no-fund
          npm audit --prefix ops/kyc-security --audit-level=low

  secret-scan:
    # Cheap regex sweep for accidental key commits. Blocks obvious leaks
    # without needing a paid scanner. Whitelist-safe: publishable/anon
    # Supabase keys live in .env and are OK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan for service-role keys and private material
        run: |
          set -e
          patterns='SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*[A-Za-z0-9._-]{20,}|BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|sk_test_[0-9A-Za-z]{16,}'
          jwt_hits=0
          while IFS=: read -r file line token; do
            payload=$(printf '%s' "$token" | cut -d. -f2)
            pad=$(( (4 - ${#payload} % 4) % 4 ))
            padded="$payload$(printf '=%.0s' $(seq 1 $pad))"
            decoded=$(printf '%s' "$padded" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
            if printf '%s' "$decoded" | grep -q '"role"[[:space:]]*:[[:space:]]*"service_role"'; then
              echo "::error file=$file,line=$line::service_role JWT detected"
              jwt_hits=$((jwt_hits+1))
            fi
          done < <(grep -R -noE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude='*.lock' --exclude='bun.lock' --exclude='bun.lockb' \
              --exclude-dir=.github . || true)
          if grep -R -nE "$patterns" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude='*.lock' --exclude='bun.lock' --exclude='bun.lockb' \
              --exclude-dir=.github \
              .; then
            echo "::error::Potential secret detected. Rotate the key and remove it from the repo."
            exit 1
          fi
          if [ "$jwt_hits" -gt 0 ]; then
            echo "::error::Committed JWT(s) with role=service_role. Rotate immediately."
            exit 1
          fi
