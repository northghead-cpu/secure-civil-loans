name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pin third-party workflow code to immutable commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run vitest run
      - name: Typecheck
        run: bun x tsc -b --noEmit
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build

  audit:
    # Supply-chain gate: fail the build on any high/critical advisory in
    # runtime dependencies. The advisory service is external infrastructure;
    # if it is unreachable, report that limitation explicitly instead of
    # misclassifying an unavailable audit as a clean audit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: |
          set +e
          timeout 120s npm audit --no-package-lock --omit=dev --audit-level=high
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "::warning::Production dependency audit timed out; CI cannot confirm advisory availability. This is an infrastructure limitation, not a clean audit result."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Audit dev dependencies (non-blocking)
        run: |
          set +e
          timeout 60s bun audit --audit-level=high
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "::warning::Development dependency audit timed out; CI cannot confirm advisory availability."
          elif [ "$status" -ne 0 ]; then
            echo "::warning::Development dependency audit reported high/critical findings or another audit error; production CI remains governed by the blocking runtime-dependency audit."
          fi

  secret-scan:
    # Cheap regex sweep for accidental key commits. Blocks obvious leaks
    # without needing a paid scanner. Whitelist-safe: publishable/anon
    # Supabase keys live in .env and are OK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan for service-role keys and private material
        run: |
          set -e
          patterns='SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*[A-Za-z0-9._-]{20,}|BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|sk_test_[0-9A-Za-z]{16,}'
          jwt_hits=0
          while IFS=: read -r file line token; do
            payload=$(printf '%s' "$token" | cut -d. -f2)
            pad=$(( (4 - ${#payload} % 4) % 4 ))
            padded="$payload$(printf '=%.0s' $(seq 1 $pad))"
            decoded=$(printf '%s' "$padded" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
            if printf '%s' "$decoded" | grep -q '\"role\"[[:space:]]*:[[:space:]]*\"service_role\"'; then
              echo "::error file=$file,line=$line::service_role JWT detected"
              jwt_hits=$((jwt_hits+1))
            fi
          done < <(grep -R -noE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude='*.lock' --exclude='bun.lock' --exclude='bun.lockb' \
              --exclude-dir=.github . || true)
          if grep -R -nE "$patterns" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude='*.lock' --exclude='bun.lock' --exclude='bun.lockb' \
              --exclude-dir=.github \
              .; then
            echo "::error::Potential secret detected. Rotate the key and remove it from the repo."
            exit 1
          fi
          if [ "$jwt_hits" -gt 0 ]; then
            echo "::error::Committed JWT(s) with role=service_role. Rotate immediately."
            exit 1
          fi
