name: Temporary lockfile synchronization

on:
  push:
    branches: [fix/supabase-migration-history]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/supabase-migration-history
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --lockfile-only
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized"
            exit 0
          fi
          git add bun.lock
          git commit -m "chore: synchronize Bun lockfile [lock-sync]"
          git push origin HEAD:fix/supabase-migration-history
