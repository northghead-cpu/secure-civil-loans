name: Temporary vulnerable dependency remediation
on:
  push:
    branches: [security/riverbanc-access-hardening-20261010]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  update-braces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/riverbanc-access-hardening-20261010
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c624d6
        with:
          bun-version: 1.3.14
      - name: Update vulnerable transitive dependency and lockfiles
        run: |
          bun update braces
          npm update braces --package-lock-only --ignore-scripts
          bun audit --prod --audit-level=high
          git add bun.lock package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "security: update vulnerable braces dependency"
            git push origin HEAD:security/riverbanc-access-hardening-20261010
          else
            echo "No lockfile changes were needed."
          fi
