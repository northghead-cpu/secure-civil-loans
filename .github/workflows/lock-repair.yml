name: One-time lockfile repair

on:
  push:
    branches:
      - security/fix-proxy-addr-cve-2026-90711

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Regenerate lockfile
        run: bun install --lockfile-only
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
          else
            git add bun.lock
            git commit -m "chore: regenerate bun lockfile for proxy-addr 2.0.8 [skip ci]"
            git push
          fi
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/lock-repair.yml
          git commit -m "chore: remove one-time lock repair workflow [skip ci]"
          git push
