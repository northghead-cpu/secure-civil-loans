name: Direct Customer Sheets Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: node --test supabase/functions/sheets-export/google-sheets.checks.mjs
      - run: bun run vitest run --config vitest.sheets.config.ts
      - name: Check the deployed Sheets function with Deno
        run: >-
          npx --yes --package=deno@2.9.6 deno check
          --config=supabase/tests/edge/deno.json
          supabase/functions/sheets-export/index.ts
