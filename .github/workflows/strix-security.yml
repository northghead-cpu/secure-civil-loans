name: Strix security review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix:
    # Explicit opt-in prevents unapproved provider charges. Forks never receive secrets.
    if: >-
      vars.STRIX_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate configuration
        env:
          STRIX_LLM: ${{ vars.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          STRIX_REPORT_PASSWORD: ${{ secrets.STRIX_REPORT_PASSWORD }}
        run: |
          test -n "$STRIX_LLM" || { echo "::error::Set the STRIX_LLM repository variable."; exit 1; }
          test -n "$LLM_API_KEY" || { echo "::error::Set the STRIX_LLM_API_KEY repository secret."; exit 1; }
          test "${#STRIX_REPORT_PASSWORD}" -ge 32 || { echo "::error::Set STRIX_REPORT_PASSWORD to at least 32 random characters."; exit 1; }
          docker info > /dev/null

      - name: Install verified Strix 1.7.0 binary
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/strix.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/usestrix/strix/releases/download/v1.7.0/strix-1.7.0-linux-x86_64.tar.gz \
            --output "$archive"
          echo "b8cd7e84d63cbeff6726301a9e08fddedf40fc6a4edcdb4edda8a853b3312de6  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/strix-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/strix-bin"
          chmod 755 "$RUNNER_TEMP/strix-bin/strix-1.7.0-linux-x86_64"
          echo "$RUNNER_TEMP/strix-bin" >> "$GITHUB_PATH"

      - name: Review source in disposable sandbox
        env:
          STRIX_LLM: ${{ vars.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          LLM_API_BASE: ${{ vars.STRIX_LLM_API_BASE }}
          STRIX_TELEMETRY: '0'
        run: |
          set -euo pipefail
          mode=quick
          scope=auto
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode=deep
            scope=full
          fi
          # Reports and console output may contain exploit details: never print them in public logs.
          set +e
          strix-1.7.0-linux-x86_64 -n --target . --scan-mode "$mode" \
            --scope-mode "$scope" --max-budget 1 --max-turns 100 \
            --instruction-file .github/strix-scope.md > "$RUNNER_TEMP/strix-console.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::Strix found vulnerabilities or could not complete. Review the encrypted report."
            exit "$result"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          records = list(Path("strix_runs").glob("*/run.json"))
          if len(records) != 1 or json.loads(records[0].read_text()).get("status") != "completed":
              raise SystemExit("Strix scan incomplete; this is not a security pass.")
          PY

      - name: Encrypt scan evidence
        if: always()
        env:
          STRIX_REPORT_PASSWORD: ${{ secrets.STRIX_REPORT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${#STRIX_REPORT_PASSWORD}" -lt 32 ]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/strix-evidence"
          if [ -d strix_runs ]; then cp -R strix_runs "$RUNNER_TEMP/strix-evidence/"; fi
          if [ -f "$RUNNER_TEMP/strix-console.log" ]; then cp "$RUNNER_TEMP/strix-console.log" "$RUNNER_TEMP/strix-evidence/"; fi
          tar -czf "$RUNNER_TEMP/strix-evidence.tar.gz" -C "$RUNNER_TEMP/strix-evidence" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
            -in "$RUNNER_TEMP/strix-evidence.tar.gz" \
            -out "$RUNNER_TEMP/strix-report.enc" -pass env:STRIX_REPORT_PASSWORD

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strix-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strix-report.enc
          if-no-files-found: ignore
          retention-days: 7
