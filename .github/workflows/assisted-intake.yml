name: Assisted intake checks
on:
  pull_request:
    paths:
      - 'src/components/admin/AssistedKycIntake.tsx'
      - 'src/pages/admin/UsersKYC.tsx'
      - 'supabase/functions/admin-create-customer/**'
      - 'supabase/functions/upload-kyc-document/**'
      - 'supabase/migrations/20261117100000_assisted_customer_intake.sql'
      - 'scripts/test-assisted-intake.mjs'
      - '.github/workflows/assisted-intake.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: node scripts/test-assisted-intake.mjs
      - run: bun x tsc -b --noEmit
      - run: bun run build
      - run: bun run test
      - run: npx --yes --package=deno@2.9.6 deno check --config=supabase/tests/edge/deno.json supabase/functions/admin-create-customer/index.ts
