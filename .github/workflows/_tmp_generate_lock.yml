name: Temporary lockfile generation

on:
  push:
    branches: [tmp/generate-stage5-lockfile]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Regenerate lockfile
        run: bun install --lockfile-only
      - name: Emit lockfile for retrieval
        run: |
          echo LOCKFILE_BASE64_START
          base64 -w0 bun.lock
          echo
          echo LOCKFILE_BASE64_END
